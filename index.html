<!DOCTYPE html> 
<html lang="pt-BR"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Nosso Cardápio</h1>
        <p>Cadastre novos pratos e gerencie seu menu digital.</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastrar Novo Prato</h2>
            <form id="product-form">
                <div class="form-group">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" required placeholder="Ex: Batata Frita">
                </div>

                <div class="form-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" step="0.01" required placeholder="Ex: 25.00">
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="3" required placeholder="Ingredientes e detalhes do prato..."></textarea>
                </div>

                <div class="form-group">
                    <label for="imagem">URL da Imagem</label>
                    <input type="url" id="imagem" required placeholder="https://exemplo.com/imagem.jpg">
                </div>

                <button type="submit" class="card-btn">Salvar Produto</button>
            </form>
        </section>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid #ddd;">

        <section id="menu-container" class="menu-grid"></section>
    </main>

    <script src="app.js"></script>
</body>
</html>
